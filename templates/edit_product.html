<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="layout">

    {% include 'sidebar.html' %}

    <main class="main-content">

        <h1>Edit Product</h1>
        <p>Update the details of your warehouse product.</p>

        <h2 class="section-title">Product Information</h2>

        <div class="activity-card">

            <form method="POST">

                <label>Product Name</label>
                <input type="text"
                       name="product_name"
                       value="{{ product.product_name }}"
                       required>

                <br><br>

                <label>Category</label>
                <select name="category_id">
                    <option value="">Select Category</option>

                    {% for category in categories %}
                    <option value="{{ category.category_id }}"
                        {% if category.category_id == product.category_id %}selected{% endif %}>
                        {{ category.category_name }}
                    </option>
                    {% endfor %}
                </select>

                <br><br>

                <label>Supplier</label>
                <select name="supplier_id">
                    <option value="">Select Supplier</option>

                    {% for supplier in suppliers %}
                    <option value="{{ supplier.supplier_id }}"
                        {% if supplier.supplier_id == product.supplier_id %}selected{% endif %}>
                        {{ supplier.supplier_name }}
                    </option>
                    {% endfor %}
                </select>

                <br><br>

                <label>Unit Price (₹)</label>
                <input type="number"
                       name="unit_price"
                       value="{{ product.unit_price }}"
                       step="0.01"
                       min="0"
                       required>

                <br><br>

                <label>Current Stock</label>
                <input type="number"
                       name="current_stock"
                       value="{{ product.current_stock }}"
                       min="0"
                       required>

                <br><br>

                <label>Minimum Stock Level</label>
                <input type="number"
                       name="minimum_stock"
                       value="{{ product.minimum_stock }}"
                       min="0"
                       required>

                <br><br>

                <button type="submit">Save Changes</button>

                <a href="{{ url_for('products') }}">Cancel</a>

            </form>

        </div>

    </main>

</div>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>

</body>
</html>
